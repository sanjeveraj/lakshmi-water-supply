<!DOCTYPE html>
<!--
  LAKSHMI WATER SUPPLY — Delivery Log (internal use)
  ===================================================
  This is a quick delivery-logging tool for you to use while doing
  deliveries — not a public order form. Add each customer once, then
  just pick them from the list and log each delivery in a few taps.

  SETUP:

  1. Create a free project at https://supabase.com
  2. In the SQL Editor, run:

     create table customers (
       id uuid primary key default gen_random_uuid(),
       created_at timestamptz default now(),
       name text not null,
       phone text,
       address text
     );

     create table deliveries (
       id uuid primary key default gen_random_uuid(),
       created_at timestamptz default now(),
       customer_id uuid references customers(id) on delete set null,
       customer_name text not null,
       can_price int not null,
       quantity int not null default 1,
       total int generated always as (can_price * quantity) stored,
       delivery_date date not null default current_date
     );

     alter table customers enable row level security;
     alter table deliveries enable row level security;

     create policy "allow all on customers" on customers
       for all to anon using (true) with check (true);
     create policy "allow all on deliveries" on deliveries
       for all to anon using (true) with check (true);

     -- NOTE: this gives full read/write access to anyone who has this
     -- page's link, since there is no login. That's fine as long as
     -- you keep the link to yourself. If you ever share it with staff,
     -- or worry about it leaking, tell me and I'll add a passcode or
     -- real login.

  3. In Project Settings → API, copy your "Project URL" and "anon
     public" key, and paste them into SUPABASE_URL / SUPABASE_ANON_KEY
     below (search for "PASTE YOUR").
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#0A4F58">
<title>Lakshmi Water Supply — Delivery Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0A2E36;
    --teal:#106B77;
    --teal-light:#3FA7B3;
    --teal-dark:#08343C;
    --copper:#C97D3C;
    --mist:#EEF6F6;
    --white:#FFFFFF;
    --danger:#B3402F;
    --line:#DCE9E8;
    --radius:18px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--mist);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-feature-settings:'tnum' 1;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:'Fraunces',serif; margin:0; color:var(--teal-dark); }

  .wrap{ max-width:480px; margin:0 auto; padding:0 18px 48px; }

  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; padding:14px 18px;
    background:rgba(238,246,246,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark svg{ width:32px; height:32px; display:block; }
  .brand-eyebrow{ margin:0; font-size:11px; letter-spacing:.03em; color:var(--teal); font-weight:600; }
  .brand h1{ font-size:18px; line-height:1.1; font-weight:600; }

  .stat-strip{ display:flex; gap:10px; margin:20px 0 20px; }
  .stat-box{ flex:1; background:var(--white); border:1px solid var(--line); border-radius:14px; padding:13px 14px; text-align:center; }
  .stat-box .num{ font-family:'Fraunces',serif; font-size:22px; font-weight:600; color:var(--teal-dark); }
  .stat-box .label{ font-size:11.5px; color:#5b7a7d; margin-top:2px; }

  .card{
    background:var(--white); border-radius:var(--radius);
    padding:20px 20px 22px; box-shadow:0 10px 30px -14px rgba(10,46,54,0.2);
    border:1px solid var(--line);
  }

  .section-title{ font-size:12.5px; font-weight:700; letter-spacing:.03em; color:var(--teal); text-transform:uppercase; margin:0 0 10px; }

  input[type=text], input[type=tel], input[type=date], select{
    width:100%; font-family:'Inter',sans-serif; font-size:16px; color:var(--ink);
    background:var(--mist); border:1.5px solid var(--line); border-radius:12px;
    padding:12px 13px; outline:none; transition:border-color .15s ease;
  }
  input:focus, select:focus{ border-color:var(--teal); }
  select{ appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%23106B77' stroke-width='2' fill='none' stroke-linecap='round'/></svg>");
    background-repeat:no-repeat; background-position:right 13px center;
  }

  .customer-row{ display:flex; gap:10px; align-items:center; margin-bottom:16px; }
  .customer-row select{ flex:1; }
  .add-customer-btn{
    flex-shrink:0; background:var(--mist); border:1.5px solid var(--line); border-radius:12px;
    width:44px; height:44px; font-size:20px; font-weight:700; color:var(--teal-dark); cursor:pointer;
  }
  .add-customer-btn:active{ transform:scale(.95); }

  .new-customer-form{ display:none; background:var(--mist); border:1.5px dashed var(--line); border-radius:14px; padding:14px; margin-bottom:16px; }
  .new-customer-form.show{ display:block; }
  .new-customer-form input{ margin-bottom:10px; background:var(--white); }
  .new-customer-form .row-btns{ display:flex; gap:10px; }
  .new-customer-form .row-btns button{ flex:1; }
  .save-customer-btn{ background:var(--teal-dark); color:#fff; border:none; border-radius:10px; padding:11px; font-weight:700; font-size:14px; cursor:pointer; }
  .cancel-btn{ background:none; border:1.5px solid var(--line); border-radius:10px; padding:11px; font-weight:600; font-size:14px; color:#3A5B60; cursor:pointer; }

  .price-buttons{ display:flex; gap:10px; margin-top:2px; }
  .price-btn{ flex:1; padding:14px 0; border-radius:12px; border:1.5px solid var(--line); background:var(--mist); font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--teal-dark); cursor:pointer; }
  .price-btn.active{ background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; }

  .stepper{ display:flex; align-items:center; justify-content:space-between; max-width:140px; background:var(--mist); border:1.5px solid var(--line); border-radius:12px; padding:4px; }
  .stepper button{ width:38px; height:38px; border-radius:9px; border:none; background:var(--white); color:var(--teal-dark); font-size:19px; font-weight:700; cursor:pointer; box-shadow:0 1px 2px rgba(10,46,54,.15); }
  .stepper button:active{ transform:scale(.93); }
  .stepper span{ font-size:17px; font-weight:700; min-width:24px; text-align:center; }

  .date-input-wrap{ margin-top:16px; }
  .date-input-wrap label{ display:block; font-size:12px; font-weight:600; color:#3A5B60; margin-bottom:6px; }

  .error{ color:var(--danger); font-size:13.5px; font-weight:600; margin:10px 0 0; min-height:0; }
  .error:empty{ display:none; margin:0; }

  .submit-btn{
    width:100%; border:none; cursor:pointer;
    background:linear-gradient(180deg, var(--teal) 0%, var(--teal-dark) 100%);
    color:var(--white); font-family:'Inter',sans-serif; font-size:16px; font-weight:700;
    padding:15px; border-radius:13px; box-shadow:0 8px 20px -8px rgba(8,52,60,.55);
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .submit-btn:active{ transform:scale(.985); }
  .submit-btn[disabled]{ opacity:.65; pointer-events:none; }
  .spinner{ width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; animation:spin .7s linear infinite; display:none; }
  .submit-btn.loading .spinner{ display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .log-list{ margin-top:10px; }
  .log-item{ display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .log-item:last-child{ border-bottom:none; }
  .who{ font-weight:700; font-size:14.5px; }
  .meta{ font-size:12.5px; color:#5b7a7d; margin-top:2px; }
  .amt{ font-weight:700; color:var(--teal-dark); font-size:15px; }
  .del{ background:none; border:none; color:var(--danger); font-size:16px; cursor:pointer; margin-left:10px; padding:4px; }
  .empty-note{ font-size:13.5px; color:#5b7a7d; padding:6px 0; }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px);
    background:var(--teal-dark); color:#fff; padding:12px 20px; border-radius:999px;
    font-size:14px; font-weight:600; opacity:0; pointer-events:none;
    transition:all .25s ease; z-index:60; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }
</style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><path d="M14,4 h12 v6 a4,4 0 0 1 4,4 v20 a4,4 0 0 1 -4,4 h-12 a4,4 0 0 1 -4,-4 v-20 a4,4 0 0 1 4,-4 z" fill="#106B77"/><rect x="14" y="4" width="12" height="4" rx="1.5" fill="#C97D3C"/></svg>
      </span>
      <div class="brand-text">
        <p class="brand-eyebrow">குடிநீர் விநியோகம்</p>
        <h1>Lakshmi Water Supply</h1>
      </div>
    </div>
    <span id="headerDate" style="font-size:12.5px;font-weight:600;color:#3A5B60;"></span>
  </header>

  <div class="wrap">

    <div class="stat-strip">
      <div class="stat-box"><div class="num" id="statCans">0</div><div class="label">Cans today</div></div>
      <div class="stat-box"><div class="num" id="statAmount">₹0</div><div class="label">Collected today</div></div>
    </div>

    <section class="card">
      <p class="section-title">Log a delivery</p>

      <div class="customer-row">
        <select id="customerSelect">
          <option value="">Select customer</option>
        </select>
        <button type="button" class="add-customer-btn" id="toggleAddCustomer" aria-label="Add new customer">+</button>
      </div>

      <div class="new-customer-form" id="newCustomerForm">
        <input type="text" id="newName" placeholder="Customer name">
        <input type="tel" id="newPhone" placeholder="Phone (optional)" inputmode="numeric" maxlength="10">
        <input type="text" id="newAddress" placeholder="Address (optional)">
        <div class="row-btns">
          <button type="button" class="cancel-btn" id="cancelAddCustomer">Cancel</button>
          <button type="button" class="save-customer-btn" id="saveCustomer">Save customer</button>
        </div>
      </div>

      <p class="section-title" style="margin-top:18px;">Can price</p>
      <div class="price-buttons">
        <button type="button" class="price-btn" data-price="28">₹28</button>
        <button type="button" class="price-btn" data-price="30">₹30</button>
        <button type="button" class="price-btn" data-price="35">₹35</button>
      </div>

      <p class="section-title" style="margin-top:18px;">Number of cans</p>
      <div class="stepper">
        <button type="button" id="qtyMinus" aria-label="Decrease">−</button>
        <span id="qtyValue">1</span>
        <button type="button" id="qtyPlus" aria-label="Increase">+</button>
      </div>

      <div class="date-input-wrap">
        <label for="deliveryDate">Date</label>
        <input type="date" id="deliveryDate">
      </div>

      <p class="error" id="formError" role="alert" aria-live="polite"></p>

      <button type="button" class="submit-btn" id="saveDeliveryBtn" style="margin-top:16px;">
        <span class="spinner"></span>
        <span class="btn-label">Save delivery</span>
      </button>
    </section>

    <section style="margin-top:24px;">
      <p class="section-title">Today's log</p>
      <div class="card log-list" id="logList">
        <p class="empty-note">No deliveries logged yet today.</p>
      </div>
    </section>

  </div>

  <div class="toast" id="toast"></div>

<script>
  // ------------------------------------------------------------------
  // SUPABASE CONFIG — paste your project's values here
  // ------------------------------------------------------------------
  const SUPABASE_URL = "https://negosgsjiniutnejytye.supabase.co/rest/v1/";
  const SUPABASE_ANON_KEY = "sb_publishable_lgmS1R7tP3g0NWcd5DgLng_6rwtnHf0";

  const supabaseReady = !SUPABASE_URL.startsWith("PASTE") && !SUPABASE_ANON_KEY.startsWith("PASTE");
  const supabase = supabaseReady
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  function todayStr(){
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }

  document.getElementById('headerDate').textContent =
    new Date().toLocaleDateString('en-IN', { weekday:'short', day:'numeric', month:'short' });

  const customerSelect = document.getElementById('customerSelect');
  const toggleAddCustomer = document.getElementById('toggleAddCustomer');
  const newCustomerForm = document.getElementById('newCustomerForm');
  const cancelAddCustomer = document.getElementById('cancelAddCustomer');
  const saveCustomerBtn = document.getElementById('saveCustomer');
  const priceButtons = document.querySelectorAll('.price-btn');
  const qtyValueEl = document.getElementById('qtyValue');
  const dateInput = document.getElementById('deliveryDate');
  const formError = document.getElementById('formError');
  const saveDeliveryBtn = document.getElementById('saveDeliveryBtn');
  const logList = document.getElementById('logList');
  const statCans = document.getElementById('statCans');
  const statAmount = document.getElementById('statAmount');
  const toast = document.getElementById('toast');

  let qty = 1;
  let selectedPrice = null;
  let todayDeliveries = [];

  dateInput.value = todayStr();

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 1800);
  }
  function showError(msg){ formError.textContent = msg; }

  // ---- Customers ----
  async function loadCustomers(){
    if (!supabaseReady) return;
    const { data, error } = await supabase.from('customers').select('id,name').order('name');
    if (error){ console.error(error); return; }
    customerSelect.innerHTML = '<option value="">Select customer</option>' +
      data.map(c => `<option value="${c.id}" data-name="${c.name.replace(/"/g,'&quot;')}">${c.name}</option>`).join('');
  }

  toggleAddCustomer.addEventListener('click', () => {
    newCustomerForm.classList.toggle('show');
  });
  cancelAddCustomer.addEventListener('click', () => {
    newCustomerForm.classList.remove('show');
    document.getElementById('newName').value = '';
    document.getElementById('newPhone').value = '';
    document.getElementById('newAddress').value = '';
  });
  saveCustomerBtn.addEventListener('click', async () => {
    const name = document.getElementById('newName').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const address = document.getElementById('newAddress').value.trim();
    if (!name){ showError('Enter customer name.'); return; }
    if (!supabaseReady){ showError('Database not connected yet.'); return; }
    showError('');
    const { data, error } = await supabase.from('customers')
      .insert({ name, phone: phone || null, address: address || null })
      .select().single();
    if (error){ console.error(error); showError('Could not save customer.'); return; }
    await loadCustomers();
    customerSelect.value = data.id;
    newCustomerForm.classList.remove('show');
    document.getElementById('newName').value = '';
    document.getElementById('newPhone').value = '';
    document.getElementById('newAddress').value = '';
    showToast(`${name} added`);
  });

  // ---- Price buttons ----
  priceButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      priceButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedPrice = parseInt(btn.dataset.price, 10);
    });
  });

  // ---- Quantity stepper ----
  document.getElementById('qtyMinus').addEventListener('click', () => {
    qty = Math.max(1, qty - 1); qtyValueEl.textContent = qty;
  });
  document.getElementById('qtyPlus').addEventListener('click', () => {
    qty = Math.min(50, qty + 1); qtyValueEl.textContent = qty;
  });

  // ---- Save delivery ----
  saveDeliveryBtn.addEventListener('click', async () => {
    showError('');
    const custOption = customerSelect.selectedOptions[0];
    const customerId = customerSelect.value;
    if (!customerId){ showError('Select a customer.'); return; }
    if (!selectedPrice){ showError('Choose a can price.'); return; }
    if (!supabaseReady){ showError('Database not connected yet.'); return; }

    saveDeliveryBtn.classList.add('loading');
    saveDeliveryBtn.disabled = true;

    const { data, error } = await supabase.from('deliveries').insert({
      customer_id: customerId,
      customer_name: custOption.dataset.name,
      can_price: selectedPrice,
      quantity: qty,
      delivery_date: dateInput.value || todayStr()
    }).select().single();

    saveDeliveryBtn.classList.remove('loading');
    saveDeliveryBtn.disabled = false;

    if (error){ console.error(error); showError('Could not save. Try again.'); return; }

    if (data.delivery_date === todayStr()){
      todayDeliveries.unshift(data);
      renderLog();
    }
    showToast('Delivery saved');

    customerSelect.value = '';
    priceButtons.forEach(b => b.classList.remove('active'));
    selectedPrice = null;
    qty = 1; qtyValueEl.textContent = qty;
    dateInput.value = todayStr();
  });

  // ---- Today's log ----
  function renderLog(){
    if (todayDeliveries.length === 0){
      logList.innerHTML = '<p class="empty-note">No deliveries logged yet today.</p>';
      statCans.textContent = '0';
      statAmount.textContent = '₹0';
      return;
    }
    let cans = 0, amount = 0;
    logList.innerHTML = todayDeliveries.map(d => {
      cans += d.quantity;
      amount += d.total;
      const time = new Date(d.created_at).toLocaleTimeString('en-IN', { hour:'2-digit', minute:'2-digit' });
      return `<div class="log-item" data-id="${d.id}">
        <div>
          <div class="who">${d.customer_name}</div>
          <div class="meta">${d.quantity} can${d.quantity>1?'s':''} × ₹${d.can_price} · ${time}</div>
        </div>
        <div style="display:flex;align-items:center;">
          <span class="amt">₹${d.total}</span>
          <button class="del" data-id="${d.id}" aria-label="Delete entry">✕</button>
        </div>
      </div>`;
    }).join('');
    statCans.textContent = cans;
    statAmount.textContent = `₹${amount}`;

    logList.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        if (supabaseReady){
          const { error } = await supabase.from('deliveries').delete().eq('id', id);
          if (error){ console.error(error); showToast('Could not delete'); return; }
        }
        todayDeliveries = todayDeliveries.filter(d => d.id !== id);
        renderLog();
      });
    });
  }

  async function loadTodayDeliveries(){
    if (!supabaseReady) return;
    const { data, error } = await supabase.from('deliveries')
      .select('*')
      .eq('delivery_date', todayStr())
      .order('created_at', { ascending: false });
    if (error){ console.error(error); return; }
    todayDeliveries = data;
    renderLog();
  }

  loadCustomers();
  loadTodayDeliveries();
</script>
</body>
</html>
